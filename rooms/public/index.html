<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/room.css"><title>Chaos Shop</title></head>
<body><main>
<div id="lobby" class="row"><button id="create">Создать комнату</button><input id="code" maxlength="10" aria-label="Код комнаты" placeholder="Код комнаты" autocomplete="off" spellcheck="false"><button id="join">Войти</button></div>
<div id="room" class="row" hidden><strong id="roster"></strong><input id="invite" readonly aria-label="Код комнаты"><button id="copy">Копировать код</button><button id="leave">Выйти</button></div>
<p id="status" role="status"></p>
</main><script src="/room.js"></script></body></html>
